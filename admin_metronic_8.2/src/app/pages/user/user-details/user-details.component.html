<article class="card"><div class="card-body" *ngIf="user.id"><a routerLink="/personal/empleados">Volver a empleados</a>
<h1 class="my-4">{{user.name}}</h1><dl class="row"><dt class="col-4">Usuario</dt><dd class="col-8">{{user.username}}</dd>
<dt class="col-4">Correo</dt><dd class="col-8">{{user.email}}</dd><dt class="col-4">Estado</dt><dd class="col-8">{{user.status}}</dd>
<dt class="col-4">Perfiles</dt><dd class="col-8"><span class="badge badge-light-primary me-1" *ngFor="let rol of user.roles">{{rol.name}}</span></dd>
<dt class="col-4">Teléfono</dt><dd class="col-8">{{user.phone || 'Sin registrar'}}</dd></dl>
<a routerLink="/accesos" [queryParams]="{empleado:user.id}">Consultar permisos heredados y actividad</a></div></article>
