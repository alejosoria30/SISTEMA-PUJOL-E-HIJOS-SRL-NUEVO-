
<!-- ====================================== -->
<!-- LOGO PRINCIPAL - PUJOL E HIJOS         -->
<!-- ====================================== -->

<a
  routerLink="/dashboard"
  class="d-flex align-items-center text-decoration-none"
  aria-label="Ir al inicio de Pujol e Hijos"
>

  <!-- Logo cuando el menú está expandido -->
  <div class="app-sidebar-logo-default">

    <img
      src="assets/media/logos/pujol-logo.png"
      alt="Pujol e Hijos - Distribuidora Mayorista"
      style="
        display: block;
        width: 170px;
        max-width: 100%;
        height: auto;
        max-height: 55px;
        object-fit: contain;
      "
    />

  </div>

  <!-- Logo cuando el menú está contraído -->
  <div class="app-sidebar-logo-minimize">

    <img
      src="assets/media/logos/pujol-icono.png"
      alt="PH"
      style="
        display: block;
        width: 36px;
        height: 36px;
        object-fit: contain;
      "
    />

  </div>

</a>

<!-- ====================================== -->
<!-- BOTÓN PARA CONTRAER EL MENÚ            -->
<!-- ====================================== -->

<ng-container *ngIf="toggleEnabled">

  <div
    id="kt_app_sidebar_toggle"
    class="app-sidebar-toggle btn btn-icon btn-shadow btn-sm btn-color-muted btn-active-color-primary body-bg h-30px w-30px position-absolute top-50 start-100 translate-middle rotate"
    [ngClass]="toggleButtonClass"
    data-kt-toggle="true"
    [attr.data-kt-toggle-state]="toggleState"
    data-kt-toggle-target="body"
    [attr.data-kt-toggle-name]="toggleAttr"
  >

    <app-keenicon
      name="double-left"
      class="fs-2 rotate-180"
    ></app-keenicon>

  </div>

</ng-container>
