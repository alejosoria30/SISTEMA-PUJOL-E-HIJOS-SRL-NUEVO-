<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Pujol e Hijos S.R.L.</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="shortcut icon" type="image/png" href="./assets/media/logos/logos/favicon.ico" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap">
  <!-- SPLASH SCREEN-->
  <link rel="stylesheet" id="layout-styles-anchor" href="./assets/splash-screen.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body root id="kt_body" class="mat-typography">
  <!-- <body root id="kt_body" class="mat-typography" direction="rtl" dir="rtl" style="direction: rtl"></body> -->
  <!--begin::Theme mode setup on page load-->
  <script>
    if (document.documentElement) {
      var defaultThemeMode = "system";

      var hasKTName = document.body.hasAttribute("data-kt-name");
      var lsKey = "kt_" + (hasKTName ? name + "_" : "") + "theme_mode_value"
      var themeMode = localStorage.getItem(lsKey);
      if (!themeMode) {
        if (defaultThemeMode === "system") {
          themeMode =
            window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        } else {
          themeMode = defaultThemeMode;
        }
      }

      document.documentElement.setAttribute("data-bs-theme", themeMode);
    }
  </script>
  <!--end::Theme mode setup on page load-->
  <style>
    /* VARIABLES GLOBALES DE BRANDING PUJOL */
    :root {
      --bs-primary: #00A3FF;
      --bs-primary-rgb: 0, 163, 255;
      --bs-primary-active: #0081CC;
      --bs-primary-light: #E5F6FF;
    }
    
    /* MODO OSCURO PREMIUM (Midnight Glass) */
    [data-bs-theme="dark"] {
      --bs-body-bg: #0b132b;
      --bs-body-bg-rgb: 11, 19, 43;
      --bs-app-bg-color: #0b132b;
      --bs-card-bg: rgba(18, 30, 61, 0.75);
    }
    
    [data-bs-theme="dark"] .card {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 163, 255, 0.15) !important;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3) !important;
    }
    
    [data-bs-theme="dark"] .app-header {
      background-color: rgba(11, 19, 43, 0.8) !important;
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 163, 255, 0.1);
    }
    
    [data-bs-theme="dark"] .app-sidebar {
      background-color: rgba(9, 15, 34, 0.95) !important;
      border-right: 1px solid rgba(0, 163, 255, 0.1);
    }

    /* ANIMACION PREMIUM DE ENTRADA DE MODULOS/RUTAS */
    router-outlet + * {
      animation: module-fade-slide-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    @keyframes module-fade-slide-in {
      0% {
        opacity: 0;
        transform: translateY(15px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  
  <div id="splash-screen" class="splash-screen">
    <div class="logo-spinner-container">
      <svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin-icon">
        <circle cx="12" cy="12" r="11" stroke-dasharray="15 15"></circle>
      </svg>
      <img src="./assets/media/logos/pujol-logo.jpg" alt="Pujol e Hijos" class="custom-logo">
    </div>
    
    <div style="display: flex; flex-direction: column; align-items: center; margin-top: 25px;">
      <span class="splash-title">Pujol e Hijos</span>
      <span class="splash-subtitle">Distribuidora Mayorista</span>
    </div>
  </div>
</body>

</html>
